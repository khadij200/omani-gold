<div class="mb-6">
  <h2 class="text-2xl font-bold text-slate-800 mb-2">
    سجل أسعار الذهب
  </h2>

  <p class="text-slate-500">
    سجل أسعار جرام الذهب عيار 21 خلال آخر 30 يومًا — بيانات تجريبية
  </p>
</div>

<div class="overflow-x-auto bg-white border border-slate-200 rounded-xl shadow-sm">
  <table class="w-full text-right">
    <thead class="bg-slate-100">
      <tr>
        <th class="px-4 py-3">التاريخ</th>
        <th class="p-4">العيار</th>
        <th class="p-4">سعر الجرام (ر.ع)</th>
      </tr>
    </thead>

    <tbody>
       @for (item of paginatedHistory; track item.date) {
        <tr class="border-t border-slate-200 hover:bg-amber-50">
            <td class="px-4 py-3">{{ item.date }}</td>
            <td class="p-4">21K</td>
            <td class="p-4">
                {{ item.price | number:'1.3-3' }}
            </td>
        </tr>
}
    </tbody>
  </table>
</div>
<div class="flex justify-center items-center gap-4 mt-6">

  <button
    type="button"
    (click)="previousPage()"
    [disabled]="currentPage === 1"
    class="px-4 py-2 bg-slate-600 text-white rounded-lg disabled:opacity-40">
    السابق
  </button>

  <span class="text-slate-700">
    صفحة {{ currentPage }} من {{ totalPages }}
  </span>

  <button
    type="button"
    (click)="nextPage()"
    [disabled]="currentPage === totalPages"
    class="px-4 py-2 bg-amber-600 text-white rounded-lg disabled:opacity-40">
    التالي
  </button>

</div>
